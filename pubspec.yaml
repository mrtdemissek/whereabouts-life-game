name: whereabouts
description: "Whereabouts: a pastel pixel-art life simulation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  google_fonts: 8.2.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/ulkeler.json
    - assets/riskler.json
    - assets/muzik/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ikon.png"
  adaptive_icon_background: "#EADFCB"
  adaptive_icon_foreground: "assets/icon/ikon_on.png"
  web:
    generate: true
    image_path: "assets/icon/ikon.png"
    background_color: "#EADFCB"
    theme_color: "#EADFCB"